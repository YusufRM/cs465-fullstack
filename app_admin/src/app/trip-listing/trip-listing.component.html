<div class="row">
    <div class="col-12 mb-3">
        <button type="button" class="btn btn-info" (click)="addTrip()" *ngIf="isLoggedIn()">Add Trip</button>
        <p>{{ message }}</p>
    </div>
    <div *ngFor="let trip of trips" class="col-md-4 mb-4">
        <app-trip-card [trip]="trip" (tripDeleted)="onTripDeleted($event)"></app-trip-card>
    </div>
</div>
